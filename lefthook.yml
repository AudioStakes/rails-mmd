output:
  - failure

pre-commit:
  parallel: false
  commands:
    verification-routing:
      glob:
        - "*.rb"
        - "*.rake"
        - "Rakefile"
        - "exe/rails-mmd"
        - "bin/**/*"
        - "lib/**/*.rb"
        - "spec/*.rb"
        - "spec/**/*.rb"
        - "features/*.rb"
        - "features/**/*.rb"
        - ".rspec"
        - ".simplecov"
        - ".undercover.yml"
        - "Gemfile"
        - "Gemfile.lock"
        - "*.gemspec"
        - ".ruby-version"
        - ".rubocop.yml"
        - "schemas/*.json"
        - "schemas/**/*.json"
        - "fixtures/*.json"
        - "fixtures/**/*.json"
        - "fixtures/*.mmd"
        - "fixtures/**/*.mmd"
        - "AGENTS.md"
        - "README.md"
        - "docs/*.md"
        - "docs/**/*.md"
      run: bundle exec ruby -Ilib -rrails_mmd/verification_routing -e 'RailsMmd::VerificationRouting.new.run!(ARGV)' -- {staged_files}

pre-push:
  commands:
    ci-equivalent:
      run: bundle exec rake
